# Builds and publishes the OpenSteps release package when a version tag (v1.2.3) is pushed.
# The per-user install script (deploy/Install-OpenSteps.ps1) downloads this asset when IT
# does not point it at a local zip or file share.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test OpenSteps.sln -c Release

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ('${{ github.ref_type }}' -ne 'tag') { $version = '' }
          if ($version) { ./build/Publish-OpenSteps.ps1 -Version $version } else { ./build/Publish-OpenSteps.ps1 }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenSteps-win-x64
          path: |
            artifacts/OpenSteps-*-win-x64.zip
            artifacts/OpenSteps-*-win-x64.zip.sha256

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -Filter 'OpenSteps-*-win-x64.zip*' | ForEach-Object FullName
          # Release notes come from this version's section of CHANGELOG.md; fall back to GitHub's generated notes.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[|^\[[0-9]' | Select-Object -First 1).LineNumber
            $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
            $section += '', "SHA-256 checksums are attached next to each zip. Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            Set-Content -Path release-notes.md -Value $section -Encoding utf8
            gh release create '${{ github.ref_name }}' @files --title 'OpenSteps ${{ github.ref_name }}' --notes-file release-notes.md
          } else {
            gh release create '${{ github.ref_name }}' @files --title 'OpenSteps ${{ github.ref_name }}' --generate-notes
          }
